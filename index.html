<!doctype html>
<html lang="en">

    <title>AI运营中心</title>

    <script>
      (function () {
        try {
          var savedTheme = window.localStorage.getItem('ai_ops_theme_v2');
          var theme = savedTheme === 'default' ? 'default' : 'minimal';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'minimal');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
